<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estagiários - Gestão</title>

    <link rel="stylesheet" href="../../src/css/admin/global.css">

    <link rel="stylesheet" href="../../src/css/admin/estagiarios.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>

    <div class="app-container">

        <aside class="sidebar">

            <div class="logo-admin">CH</div>

            <hr class="linha-menu">

            <nav>

                <a href="index.html"><i class="fa-solid fa-chart-line"></i> Visão Geral</a>

                <a href="estagiarios.html" class="active"><i class="fa-solid fa-user-graduate"></i> Estagiários</a>

                <a href="consultas.html"><i class="fa-solid fa-calendar-check"></i> Consultas</a>

                <a href="agendar_consulta.html"><i class="fa-regular fa-calendar-plus"></i> Agendar Consulta</a>

                <a href="prontuarios.html"><i class="fa-solid fa-file-medical"></i> Prontuários</a>

                <a href="salas.html"><i class="fa-solid fa-door-open"></i> Salas</a>

            </nav>

            <hr class="linha-menu">

            <div class="sidebar-footer">

                <a href="/index.html?logout=1"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>

            </div>

        </aside>



        <main class="main-content">

            <a href="index.html" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar</a>



            <header class="cabecalho-pagina">

                <h1>Gestão de Estagiários</h1>

                <p>Cadastre estagiários e pacientes. Dados salvos no navegador (localStorage).</p>

            </header>



            <div class="filtros-barra">

                <input type="search" id="busca-estagiario" placeholder="Buscar por nome ou e-mail...">

                <div class="btn-grupo">

                    <button type="button" class="btn-admin-primario" id="btn-novo-estagiario"><i class="fa-solid fa-user-plus"></i> Novo estagiário</button>

                    <button type="button" class="btn-admin-secundario" id="btn-novo-paciente"><i class="fa-solid fa-user-injured"></i> Novo paciente</button>

                    <a href="agendar_consulta.html" class="btn-admin-secundario"><i class="fa-solid fa-calendar-plus"></i> Agendar</a>

                </div>

            </div>



            <div class="container-cards-estagiarios" id="lista-estagiarios"></div>

        </main>

    </div>



    <script src="../../data/mockApi.js"></script>

 <script src="../../src/js/clinica-config.js"></script>
    <script src="../../src/js/web-common.js"></script>
    <script>
        let lista = [];
        let sessao = null;


const renderizarCardEstagiario = (e) => `
    <div class="card-estagiario" style="background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 4px solid #72a1f8;">
        <h3 style="margin: 0 0 10px 0; color: #1e293b;">${e.nome}</h3>
        <p style="margin: 5px 0; color: #64748b; font-size: 14px;"><strong>CPF:</strong> ${e.cpf}</p>
        <p style="margin: 5px 0; color: #64748b; font-size: 14px;"><strong>Email:</strong> ${e.email || 'Não configurado'}</p>
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button class="btn-admin-secundario" onclick="editarEstagiario(${e.id})" style="padding: 6px 12px; font-size: 12px; cursor: pointer;">Editar</button>
        </div>
    </div>
`;


window.editarEstagiario = (id) => {
    const estagiario = lista.find(e => e.id === id);
    if (!estagiario) return;

    UI.abrirModal({
        titulo: 'Editar Estagiário',
        htmlCorpo: `
            <div class="input-group" style="margin-bottom: 15px;">
                <label>Nome</label>
                <input type="text" id="edit-nome" value="${estagiario.nome}" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>
            <div class="input-group" style="margin-bottom: 15px;">
                <label>Email</label>
                <input type="email" id="edit-email" value="${estagiario.email || ''}" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>
        `,
        onConfirmar: async () => {
            const nome = document.getElementById('edit-nome').value;
            const email = document.getElementById('edit-email').value;

            const res = await fetch(`http://localhost:3000/api/usuarios/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, email })
            });

            if (res.ok) {
                UI.toast('Dados atualizados com sucesso!');
                await recarregar(); 
            } else {
                alert('Erro ao atualizar.');
            }
        }
    });
};

        const montarLista = (filtro = '') => {
            const termo = filtro.toLowerCase();
            const filtrados = lista.filter(
                (e) => e.nome.toLowerCase().includes(termo) || (e.email && e.email.toLowerCase().includes(termo))
            );

            const el = document.getElementById('lista-estagiarios');
            el.innerHTML = filtrados.length
                ? filtrados.map((e) => renderizarCardEstagiario(e)).join('')
                : '<p style="text-align: center; color: #64748b; padding: 20px;">Nenhum estagiário encontrado.</p>';
        };

        const recarregar = async () => {
            try {
                const resposta = await fetch('http://localhost:3000/api/usuarios?cargo=estagiario');
                if (resposta.ok) {
                    lista = await resposta.json();
                    montarLista(document.getElementById('busca-estagiario').value);
                }
            } catch (erro) {
                console.error('Erro ao recarregar lista:', erro);
                document.getElementById('lista-estagiarios').innerHTML = '<p style="color:red; text-align:center;">Erro ao conectar com o banco de dados.</p>';
            }
        };

        window.onload = async () => {
            sessao = await WebApp.initPagina({ tipos: ['admin'], navAtivo: 'estagiarios.html' });
            if (!sessao) return;

            await recarregar();

            document.getElementById('busca-estagiario').addEventListener('input', (e) => montarLista(e.target.value));

            document.getElementById('btn-novo-estagiario').onclick = () => {
                UI.abrirModal({
                    titulo: 'Cadastrar Estagiário',
                    htmlCorpo: `
                        <div class="input-group" style="margin-bottom: 15px;">
                            <label>Nome Completo</label>
                            <input type="text" id="add-est-nome" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                        </div>
                        <div class="input-group" style="margin-bottom: 15px;">
                            <label>CPF</label>
                            <input type="text" id="add-est-cpf" maxlength="11" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                        </div>
                        <div class="input-group" style="margin-bottom: 15px;">
                            <label>Número de Matrícula</label>
                            <input type="text" id="add-est-matricula" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                        </div>
                        <div class="input-group" style="margin-bottom: 15px;">
                            <label>Estágio Atual</label>
                            <input type="text" id="add-est-estagio" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                        </div>
                    `,
                    onConfirmar: async () => {
                        const nome = document.getElementById('add-est-nome').value.trim();
                        const cpf = document.getElementById('add-est-cpf').value.trim();
                        const matricula = document.getElementById('add-est-matricula').value.trim();
                        const estagio = document.getElementById('add-est-estagio').value.trim();

                        const resposta = await fetch('http://localhost:3000/api/admin/cadastrar', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                nome, 
                                cpf, 
                                matricula, 
                                estagio_atual: estagio, 
                                cargo: 'estagiario' 
                            })
                        });
                        
                        if (resposta.ok) {
                            UI.toast('Estagiário cadastrado!');
                            await recarregar();
                        } else {
                            alert('Erro ao cadastrar.');
                        }
                    }
                });
            };

            document.getElementById('btn-novo-paciente').onclick = () => {
                UI.abrirModal({
                    titulo: 'Cadastrar Paciente',
                    htmlCorpo: `
                        <div class="input-group" style="margin-bottom: 15px;">
                            <label>Nome do Paciente</label>
                            <input type="text" id="add-pac-nome" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                        </div>
                        <div class="input-group" style="margin-bottom: 15px;">
                            <label>CPF</label>
                            <input type="text" id="add-pac-cpf" maxlength="11" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                        </div>
                    `,
                    onConfirmar: async () => {
                        const nome = document.getElementById('add-pac-nome').value.trim();
                        const cpf = document.getElementById('add-pac-cpf').value.trim();
                        const resposta = await fetch('http://localhost:3000/api/admin/cadastrar', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ nome, cpf, cargo: 'paciente' })
                        });
                        if (resposta.ok) {
                            UI.toast('Paciente cadastrado!');
                        } else {
                            alert('Erro ao cadastrar.');
                        }
                    }
                });
            };
        };
    </script>

</body>

</html>
