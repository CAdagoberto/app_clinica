<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Consulta - Admin</title>
    <link rel="stylesheet" href="../../src/css/admin/global.css">
    <link rel="stylesheet" href="../../src/css/admin/agendar_consulta.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-admin">CH</div>
            <hr class="linha-menu">
            <nav>
                <a href="index.html"><i class="fa-solid fa-chart-line"></i> Visão Geral</a>
                <a href="estagiarios.html"><i class="fa-solid fa-user-graduate"></i> Estagiários</a>
                <a href="consultas.html"><i class="fa-solid fa-calendar-check"></i> Consultas</a>
                <a href="agendar_consulta.html" class="active"><i class="fa-regular fa-calendar-plus"></i> Agendar Consulta</a>
                <a href="prontuarios.html"><i class="fa-solid fa-file-medical"></i> Prontuários</a>
                <a href="salas.html"><i class="fa-solid fa-door-open"></i> Salas</a>
            </nav>
            <hr class="linha-menu">
            <div class="sidebar-footer">
                <a href="/index.html?logout=1"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
            </div>
        </aside>

        <main class="main-content">
            <a href="consultas.html" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar</a>

            <header class="cabecalho-pagina">
                <h1>Agendar Consulta</h1>
                <p>Defina estagiário responsável, paciente, sala e horário. O paciente deve pertencer ao estagiário selecionado.</p>
            </header>

            <section class="formulario-container">
                <div class="card-formulario">
                    <form id="form-agendamento-admin">
                        <div class="grupo-input">
                            <label for="estagiario">Estagiário responsável</label>
                            <div class="wrapper-input-icone">
                                <select id="estagiario" required></select>
                                <i class="fa-solid fa-chevron-down icone-seletor"></i>
                            </div>
                        </div>

                        <div class="grupo-input">
                            <label for="paciente">Paciente</label>
                            <div class="wrapper-input-icone">
                                <select id="paciente" required>
                                    <option value="" disabled selected>Selecione o estagiário primeiro</option>
                                </select>
                                <i class="fa-solid fa-chevron-down icone-seletor"></i>
                            </div>
                            <p class="texto-ajuda">Somente pacientes vinculados ao estagiário aparecem na lista.</p>
                        </div>

                        <div class="grupo-input">
                            <label for="sala">Sala</label>
                            <div class="wrapper-input-icone">
                                <select id="sala" required>
                                    <option value="" disabled selected>Selecione a sala</option>
                                </select>
                                <i class="fa-solid fa-chevron-down icone-seletor"></i>
                            </div>
                        </div>

                        <div class="grupo-input">
                            <label for="data">Data</label>
                            <input type="date" id="data" value="2026-06-01" required>
                        </div>

                        <div class="grupo-input">
                            <label for="horario">Horário</label>
                            <input type="time" id="horario" value="10:00" required>
                        </div>

                        <div class="botoes-formulario">
                            <button type="button" class="btn-cancelar" onclick="window.location.href='consultas.html'">Cancelar</button>
                            <button type="submit" class="btn-confirmar">Confirmar Agendamento</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <script src="../../data/mockApi.js"></script>
    <script src="../../src/js/clinica-config.js"></script>
    <script src="../../src/js/web-common.js"></script>
    <script src="../../src/js/web-common.js"></script>
    <script>
        window.onload = async () => {
            const sessao = await WebApp.initPagina({ tipos: ['admin'], navAtivo: 'agendar_consulta.html' });
            if (!sessao) return;

            const hoje = new Date();
            const ano = hoje.getFullYear();
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const dia = String(hoje.getDate()).padStart(2, '0');
            document.getElementById('data').value = `${ano}-${mes}-${dia}`;

            const carregarEstagiarios = async () => {
                const selectEstagiario = document.getElementById('estagiario');
                try {
                    const resposta = await fetch('http://localhost:3000/api/usuarios?cargo=estagiario');
                    if (resposta.ok) {
                        const estagiarios = await resposta.json();
                        selectEstagiario.innerHTML = '<option value="" disabled selected>Selecione o estagiário</option>' + 
                            estagiarios.map(e => `<option value="${e.id}">${e.nome}</option>`).join('');
                    }
                } catch (erro) {
                    selectEstagiario.innerHTML = '<option value="" disabled>Erro ao carregar</option>';
                }
            };

            const carregarPacientes = async () => {
                const selectPaciente = document.getElementById('paciente');
                try {
                    const resposta = await fetch('http://localhost:3000/api/usuarios?cargo=paciente');
                    if (resposta.ok) {
                        const pacientes = await resposta.json();
                        selectPaciente.innerHTML = '<option value="" disabled selected>Selecione o paciente</option>' + 
                            pacientes.map(p => `<option value="${p.id}">${p.nome} (CPF: ${p.cpf})</option>`).join('');
                    }
                } catch (erro) {
                    selectPaciente.innerHTML = '<option value="" disabled>Erro ao carregar</option>';
                }
            };

            const carregarSalas = () => {
                document.getElementById('sala').innerHTML = `
                    <option value="" disabled selected>Selecione a sala</option>
                    <option value="1">Sala 101 - Infantil (Livre)</option>
                    <option value="2">Sala 102 - Adultos (Livre)</option>
                    <option value="3">Sala 103 - Grupo (Livre)</option>
                `;
            };

            await carregarEstagiarios();
            await carregarPacientes();
            carregarSalas();

            document.getElementById('form-agendamento-admin').onsubmit = async (e) => {
                e.preventDefault();
                
                const estagiario_id = document.getElementById('estagiario').value;
                const paciente_id = document.getElementById('paciente').value;
                const data_consulta = document.getElementById('data').value;
                const horario = document.getElementById('horario').value;

                if (!estagiario_id || !paciente_id || !data_consulta || !horario) {
                    alert('Por favor, preencha todos os campos obrigatórios!');
                    return;
                }

                try {
                    const resposta = await fetch('http://localhost:3000/api/agendar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            estagiario_id: estagiario_id,
                            paciente_id: paciente_id,
                            data_consulta: data_consulta,
                            horario: horario
                        })
                    });

                    if (resposta.ok) {
                        alert('Consulta agendada com sucesso!');
                        window.location.href = 'consultas.html'; 
                    } else {
                        const erro = await resposta.json();
                        alert('Erro: ' + erro.erro);
                    }
                } catch (err) {
                    alert('Falha ao conectar com o servidor Node.js.');
                }
            };
        };
    </script>
</body>
</html>
