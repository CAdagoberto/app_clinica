<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Consultas - Paciente</title>
    <link rel="stylesheet" href="../../src/css/paciente/global.css">
    <link rel="stylesheet" href="../../src/css/paciente/consultas.css">
    <link rel="stylesheet" href="../../src/css/paciente/index.css">
    <link rel="stylesheet" href="../../src/css/paciente/paginacao.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">CH</div>
            <hr class="linha-menu">
            <nav>
                <a href="index.html"><i class="fa-solid fa-house"></i> Início</a>
                <a href="check-in.html"><i class="fa-solid fa-calendar-check"></i> Check-in</a>
                <a href="consultas.html" class="active"><i class="fa-solid fa-clipboard-list"></i> Consultas</a>
                <a href="exames.html"><i class="fa-solid fa-file-medical"></i> Exames</a>
                <a href="materiais.html"><i class="fa-solid fa-book-open"></i> Materiais</a>
                <a href="configuracoes.html"><i class="fa-solid fa-gear"></i> Configurações</a>
            </nav>
            <hr class="linha-menu">
            <div class="sidebar-footer">
                <a href="/index.html?logout=1"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
            </div>
        </aside>

        <main class="main-content">
            <a href="index.html" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar</a>

            <header class="cabecalho-pagina">
                <h1>Minhas Consultas</h1>
                <p>Histórico completo com filtros e paginação. Confirme ou cancele consultas futuras.</p>
            </header>

            <div class="filtros-barra">
                <select id="filtro-status">
                    <option value="">Todos os status</option>
                    <option value="pendente">Aguardando confirmação</option>
                    <option value="confirmado">Confirmadas</option>
                    <option value="realizada">Realizadas</option>
                    <option value="falta">Faltas</option>
                    <option value="cancelado">Canceladas</option>
                </select>
                <select id="filtro-ordem">
                    <option value="desc">Mais recentes primeiro</option>
                    <option value="asc">Mais antigas primeiro</option>
                </select>
            </div>

            <div class="card-branco lista-consultas-paciente" id="lista-consultas"></div>
            <div id="paginacao-consultas"></div>
        </main>
    </div>

    <script src="../../data/mockApi.js"></script>
    <script src="../../src/js/clinica-config.js"></script>
    <script src="../../src/js/web-common.js"></script>
    <script src="../../src/js/web-common.js"></script>
    <script>
        let consultasPaciente = [];
        let sessaoAtiva = null;

        // --- FILTRA E ORDENA AS CONSULTAS ---
        function obterListaFiltrada() {
            const status = document.getElementById('filtro-status').value;
            const ordem = document.getElementById('filtro-ordem').value;
            
            let lista = [...consultasPaciente];
            

            if (status) {

                const statusBusca = status === 'pendente' ? 'agendada' : status;
                lista = lista.filter((c) => c.status === statusBusca);
            }
            

            lista.sort((a, b) => {
                const dataA = new Date(a.data_consulta + 'T' + a.horario);
                const dataB = new Date(b.data_consulta + 'T' + b.horario);
                return ordem === 'asc' ? dataA - dataB : dataB - dataA;
            });
            
            return lista;
        }


        const renderizarConsultas = () => {
            const lista = obterListaFiltrada();
            const container = document.getElementById('lista-consultas');

            if (lista.length === 0) {
                container.innerHTML = '<p style="text-align: center; padding: 30px; color: #64748b;">Nenhuma consulta encontrada com estes filtros.</p>';
                return;
            }

            container.innerHTML = lista.map((c) => {

                const partesData = c.data_consulta.split('-');
                const dataBr = `${partesData[2]}/${partesData[1]}/${partesData[0]}`;
                const hora = c.horario.slice(0,5);


                let corStatus = '#64748b';
                let txtStatus = c.status.toUpperCase();
                let botaoConfirmar = '';

                if (c.status === 'agendada') {
                    corStatus = '#f59e0b'; 
                    txtStatus = 'AGUARDANDO CONFIRMAÇÃO';
                    botaoConfirmar = `<button class="btn-confirmar" onclick="confirmarConsulta(${c.id})" style="margin-top: 10px; padding: 8px 16px; background: #2a75f3; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%;">Confirmar Presença</button>`;
                } else if (c.status === 'confirmado') {
                    corStatus = '#10b981'; 
                    txtStatus = 'CONFIRMADA';
                } else if (c.status === 'realizada') {
                    corStatus = '#3b82f6'; 
                }

                return `
                    <div style="padding: 20px; border-bottom: 1px solid #f1f5f9; display: flex; flex-direction: column; gap: 10px;">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div>
                                <h3 style="margin: 0 0 5px 0; color: #1e293b; font-size: 16px;">Consulta Psicológica</h3>
                                <p style="margin: 0; color: #64748b; font-size: 14px;"><i class="fa-solid fa-user-doctor"></i> Dr(a). ${c.estagiario_nome}</p>
                            </div>
                            <span style="background: ${corStatus}20; color: ${corStatus}; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold;">${txtStatus}</span>
                        </div>
                        
                        <div style="display: flex; gap: 15px; color: #475569; font-size: 14px; background: #f8fafc; padding: 10px; border-radius: 8px;">
                            <span><i class="fa-regular fa-calendar"></i> ${dataBr}</span>
                            <span><i class="fa-regular fa-clock"></i> ${hora}</span>
                        </div>
                        
                        ${botaoConfirmar}
                    </div>
                `;
            }).join('');
        };


        window.confirmarConsulta = async (idConsulta) => {
            try {
                const resposta = await fetch(`http://localhost:3000/api/consultas/${idConsulta}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'confirmado' })
                });

                if (resposta.ok) {
                    alert('Presença confirmada com sucesso!');
                    await buscarDadosDoBanco(); 
                } else {
                    alert('Erro ao tentar confirmar a consulta.');
                }
            } catch (err) {
                alert('Erro de conexão com o servidor.');
            }
        };


        const buscarDadosDoBanco = async () => {
            try {
                const resposta = await fetch(`http://localhost:3000/api/consultas/paciente/${sessaoAtiva.id}`);
                if (resposta.ok) {
                    consultasPaciente = await resposta.json();
                    renderizarConsultas();
                }
            } catch (erro) {
                document.getElementById('lista-consultas').innerHTML = '<p style="color: red; text-align: center; padding: 20px;">Erro ao carregar dados.</p>';
            }
        };


        window.onload = async function () {

            sessaoAtiva = await WebApp.initPagina({ tipos: ['paciente'], navAtivo: 'consultas.html' });
            if (!sessaoAtiva) return;

            document.getElementById('lista-consultas').innerHTML = '<p style="text-align: center; padding: 30px;">Buscando suas consultas...</p>';
            await buscarDadosDoBanco();

 
            document.getElementById('filtro-status').addEventListener('change', renderizarConsultas);
            document.getElementById('filtro-ordem').addEventListener('change', renderizarConsultas);
        };
    </script>
</body>
</html>
