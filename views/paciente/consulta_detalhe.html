<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhe da Consulta</title>
    <link rel="stylesheet" href="../../src/css/paciente/global.css">
    <link rel="stylesheet" href="../../src/css/paciente/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">CH</div>
            <hr class="linha-menu">
            <nav>
                <a href="index.html"><i class="fa-solid fa-house"></i> Início</a>
                <a href="check-in.html"><i class="fa-solid fa-calendar-check"></i> Check-in</a>
                <a href="consultas.html" class="active"><i class="fa-solid fa-clipboard-list"></i> Consultas</a>
                <a href="exames.html"><i class="fa-solid fa-file-medical"></i> Exames</a>
                <a href="materiais.html"><i class="fa-solid fa-book-open"></i> Materiais</a>
                <a href="configuracoes.html"><i class="fa-solid fa-gear"></i> Configurações</a>
            </nav>
            <hr class="linha-menu">
            <div class="sidebar-footer">
                <a href="/index.html?logout=1"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
            </div>
        </aside>

        <main class="main-content">
            <a href="consultas.html" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar às consultas</a>
            <div id="detalhe-consulta" style="width:100%;max-width:640px"></div>
        </main>
    </div>

    <script src="../../data/mockApi.js"></script>
    <script src="../../src/js/clinica-config.js"></script>
    <script src="../../src/js/web-common.js"></script>
    <script>
        window.onload = async function () {
            const sessao = await WebApp.initPagina({ tipos: ['paciente'], navAtivo: 'consultas.html' });
            if (!sessao) return;

            const id = Number(new URLSearchParams(window.location.search).get('id'));
            let c;
            try {
                c = await ClinicaAPI.getConsultaById(id);
            } catch {
                c = null;
            }
            if (!c || c.pacienteId !== sessao.id) {
                document.getElementById('detalhe-consulta').innerHTML =
                    '<p>Consulta não encontrada. <a href="consultas.html">Voltar</a></p>';
                return;
            }

            const st = ClinicaAPI.mapStatusPaciente(c.status);
            const exames = await ClinicaAPI.getSolicitacoesExameByConsulta(c.id);

            document.getElementById('detalhe-consulta').innerHTML = `
                <header class="cabecalho-pagina">
                    <h1>Consulta #${c.id}</h1>
                    <p>${c.tipo || 'Consulta'}</p>
                </header>
                <div class="card-branco" style="margin-bottom:16px">
                    <p style="margin-bottom:10px"><strong>Data:</strong> ${c.dataLabel}</p>
                    <p style="margin-bottom:10px"><strong>Horário:</strong> ${c.horario}</p>
                    <p style="margin-bottom:10px"><strong>Estagiário:</strong> ${c.estagiarioNome}</p>
                    <p style="margin-bottom:10px"><strong>Sala:</strong> ${c.salaNome}</p>
                    <p><strong>Status:</strong> <em class="${st.classe}">${st.texto}</em></p>
                </div>
                ${exames.length ? `
                <div class="card-branco" style="margin-bottom:16px">
                    <h3 style="margin-bottom:12px;color:#334155">Exames solicitados</h3>
                    ${exames.map((e) => `
                        <p style="margin-bottom:8px"><strong>${e.titulo}</strong> — ${e.anexado ? 'Anexado' : 'Pendente de anexo'}</p>
                    `).join('')}
                    <a href="exames.html" class="btn-paciente-sec" style="margin-top:12px">Ir para exames</a>
                </div>` : ''}
                <div style="display:flex;gap:10px;flex-wrap:wrap">
                    ${c.status === 'pendente' ? '<button type="button" class="btn-paciente" id="btn-conf">Confirmar</button>' : ''}
                    ${c.status === 'pendente' || c.status === 'confirmado' ? '<button type="button" class="btn-paciente-sec" id="btn-canc">Cancelar</button>' : ''}
                    <a href="check-in.html" class="btn-paciente-sec">Check-in</a>
                </div>
            `;

            document.getElementById('btn-conf')?.addEventListener('click', async () => {
                await ClinicaAPI.atualizarStatusConsulta(c.id, 'confirmado');
                alert('Consulta confirmada!');
                location.reload();
            });
            document.getElementById('btn-canc')?.addEventListener('click', async () => {
                if (!confirm('Cancelar esta consulta?')) return;
                await ClinicaAPI.atualizarStatusConsulta(c.id, 'cancelado');
                window.location.href = 'consultas.html';
            });
        };
    </script>
</body>
</html>
