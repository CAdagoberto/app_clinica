<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in - Paciente</title>
    <link rel="stylesheet" href="../../src/css/paciente/global.css">
    <link rel="stylesheet" href="../../src/css/paciente/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">CH</div>
            <hr class="linha-menu">
            <nav>
                <a href="index.html"><i class="fa-solid fa-house"></i> Início</a>
                <a href="check-in.html" class="active"><i class="fa-solid fa-calendar-check"></i> Check-in</a>
                <a href="consultas.html"><i class="fa-solid fa-clipboard-list"></i> Consultas</a>
                <a href="exames.html"><i class="fa-solid fa-file-medical"></i> Exames</a>
                <a href="materiais.html"><i class="fa-solid fa-book-open"></i> Materiais</a>
                <a href="configuracoes.html"><i class="fa-solid fa-gear"></i> Configurações</a>
            </nav>
            <hr class="linha-menu">
            <div class="sidebar-footer">
                <a href="/index.html?logout=1"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
            </div>
        </aside>

        <main class="main-content">
            <a href="index.html" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar</a>

            <header class="cabecalho-pagina">
                <h1>Check-in</h1>
                <p>Confirme sua presença na clínica no dia da consulta.</p>
            </header>

            <div id="alerta-checkin" class="alert-box info">Verificando agendamentos...</div>

            <div class="card-branco" id="conteudo-checkin" style="max-width:560px">
                <p style="color:#64748b">Carregando informações da consulta...</p>
            </div>
        </main>
    </div>

    <script src="../../src/js/clinica-config.js"></script>
    <script src="../../src/js/web-common.js"></script>
    <script>
        window.onload = async function () {

            const sessao = await WebApp.initPagina({ tipos: ['paciente'], navAtivo: 'check-in.html' });
            if (!sessao) return;

            const alerta = document.getElementById('alerta-checkin');
            const conteudo = document.getElementById('conteudo-checkin');

            const hoje = new Date();
            const ano = hoje.getFullYear();
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const dia = String(hoje.getDate()).padStart(2, '0');
            const dataHojeFormatada = `${ano}-${mes}-${dia}`;
            
            const dataBrHoje = `${dia}/${mes}/${ano}`;

            try {
 
                const resposta = await fetch(`http://localhost:3000/api/consultas/paciente/${sessao.id}`);
                
                if (resposta.ok) {
                    const consultas = await resposta.json();

                    const prox = consultas.find(c => c.data_consulta === dataHojeFormatada && c.status !== 'cancelado');

                    if (!prox) {
                        alerta.className = 'alert-box info';
                        alerta.textContent = 'Não há consultas agendadas para hoje.';
                        conteudo.innerHTML = '<p style="color:#64748b; padding: 10px 0;">Você não possui nenhuma consulta ativa para check-in na data de hoje.</p>';
                        return;
                    }


                    const jaCheckIn = prox.status === 'confirmado' || prox.status === 'realizada';
                    alerta.className = jaCheckIn ? 'alert-box sucesso' : 'alert-box info';
                    alerta.textContent = jaCheckIn ? 'Check-in já realizado! Dirija-se à recepção.' : 'Check-in disponível para a consulta de hoje.';

                    conteudo.innerHTML = `
                        <h3 style="margin-bottom:16px;color:#1e293b; display: flex; align-items: center; gap: 8px;">
                            <i class="fa-regular fa-calendar-days" style="color: #2a75f3;"></i> Atendimento de Hoje (${dataBrHoje})
                        </h3>
                        <p style="margin-bottom:12px; color: #475569;"><strong>Horário:</strong> ${prox.horario.slice(0, 5)}</p>
                        <p style="margin-bottom:12px; color: #475569;"><strong>Sala:</strong> Sala de Atendimento Geral</p>
                        <p style="margin-bottom:24px; color: #475569;"><strong>Estagiário Responsável:</strong> ${prox.estagiario_nome}</p>
                        
                        <button type="button" class="btn-paciente" id="btn-checkin" style="width:100%; justify-content:center; padding: 14px; font-weight: bold;" ${jaCheckIn ? 'disabled' : ''}>
                            ${jaCheckIn ? '✓ Check-in realizado' : 'Fazer check-in agora'}
                        </button>
                    `;


                    if (!jaCheckIn) {
                        const btn = document.getElementById('btn-checkin');
                        btn.addEventListener('click', async () => {
                            try {
                                btn.disabled = true;
                                btn.textContent = 'Processando...';

                                const respostaPut = await fetch(`http://localhost:3000/api/consultas/${prox.id}/status`, {
                                    method: 'PUT',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ status: 'confirmado' })
                                });

                                if (respostaPut.ok) {
                                    alerta.className = 'alert-box sucesso';
                                    alerta.textContent = 'Check-in realizado! Dirija-se à recepção.';
                                    btn.textContent = '✓ Check-in realizado';
                                } else {
                                    alert('Falha ao processar o check-in no servidor.');
                                    btn.disabled = false;
                                    btn.textContent = 'Fazer check-in agora';
                                }
                            } catch (err) {
                                alert('Erro ao se conectar ao servidor.');
                                btn.disabled = false;
                                btn.textContent = 'Fazer check-in agora';
                            }
                        });
                    }
                } else {
                    alerta.textContent = 'Erro ao processar agenda';
                    conteudo.innerHTML = '<p style="color: red">O servidor recusou a requisição de listagem.</p>';
                }
            } catch (erro) {
                console.error("Erro no carregamento do check-in:", erro);
                alerta.textContent = 'Erro de sincronização';
                conteudo.innerHTML = '<p style="color: red">Não foi possível conectar ao servidor Node.js.</p>';
            }
        };
    </script>
</body>
</html>
