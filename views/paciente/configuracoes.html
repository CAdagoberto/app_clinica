<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Paciente</title>
    <link rel="stylesheet" href="../../src/css/paciente/global.css">
    <link rel="stylesheet" href="../../src/css/paciente/configuracoes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">CH</div>
            <hr class="linha-menu">
            <nav>
                <a href="index.html"><i class="fa-solid fa-house"></i> Início</a>
                <a href="check-in.html"><i class="fa-solid fa-calendar-check"></i> Check-in</a>
                <a href="consultas.html"><i class="fa-solid fa-clipboard-list"></i> Consultas</a>
                <a href="exames.html"><i class="fa-solid fa-file-medical"></i> Exames</a>
                <a href="materiais.html"><i class="fa-solid fa-book-open"></i> Materiais</a>
                <a href="configuracoes.html" class="active"><i class="fa-solid fa-gear"></i> Configurações</a>
            </nav>
            <hr class="linha-menu">
            <div class="sidebar-footer">
                <a href="/index.html?logout=1"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
            </div>
        </aside>

        <main class="main-content">
            <a href="index.html" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar</a>

            <header class="cabecalho-pagina">
                <h1>Configurações</h1>
                <p>Seus dados cadastrais e preferências de conta.</p>
            </header>

            <div class="perfil-grid">
                <section class="card-branco">
                    <h3 style="margin-bottom:20px;color:#334155"><i class="fa-solid fa-user"></i> Meus dados</h3>
                    <div class="linha-config"><strong>Nome</strong><span id="cfg-nome">Carregando...</span></div>
                    <div class="linha-config"><strong>E-mail</strong><span id="cfg-email">Carregando...</span></div>
                    <div class="linha-config"><strong>CPF</strong><span id="cfg-cpf">Carregando...</span></div>
                    <div class="linha-config"><strong>Telefone</strong><span id="cfg-tel">Carregando...</span></div>
                    <div class="linha-config"><strong>Estagiário</strong><span id="cfg-est">Carregando...</span></div>
                </section>

                <section class="card-branco">
                    <h3 style="margin-bottom:20px;color:#334155"><i class="fa-solid fa-lock"></i> Segurança</h3>
                    <div class="grupo-form-config">
                        <label for="nova-senha">Nova senha</label>
                        <input type="password" id="nova-senha" placeholder="Mínimo 6 caracteres">
                    </div>
                    <div class="grupo-form-config">
                        <label for="conf-senha">Confirmar senha</label>
                        <input type="password" id="conf-senha" placeholder="Repita a senha">
                    </div>
                    <button type="button" class="btn-paciente" id="btn-salvar-senha">Atualizar senha</button>
                </section>
            </div>
        </main>
    </div>

    <script src="../../src/js/clinica-config.js"></script>
    <script src="../../src/js/web-common.js"></script>
    <script>
        window.onload = async function () {

            const sessao = await WebApp.initPagina({ tipos: ['paciente'], navAtivo: 'configuracoes.html' });
            if (!sessao) return;

   
            try {
                const resposta = await fetch(`http://localhost:3000/api/usuarios/perfil/${sessao.id}`);
                if (resposta.ok) {
                    const perfil = await resposta.json();
                    
                    document.getElementById('cfg-nome').textContent = perfil.nome || '—';
                    document.getElementById('cfg-email').textContent = perfil.email || '—';
                    document.getElementById('cfg-cpf').textContent = perfil.cpf || '—';
                    document.getElementById('cfg-tel').textContent = perfil.telefone || 'Não cadastrado';
                    document.getElementById('cfg-est').textContent = perfil.estagiario_nome ? `Dr(a). ${perfil.estagiario_nome}` : 'Aguardando vínculo';
                }
            } catch (erro) {
                console.error("Erro ao buscar perfil:", erro);
                document.getElementById('cfg-nome').textContent = 'Erro de conexão';
            }


            document.getElementById('btn-salvar-senha').addEventListener('click', async () => {
                const novaSenha = document.getElementById('nova-senha').value;
                const confSenha = document.getElementById('conf-senha').value;
                const btnSalvar = document.getElementById('btn-salvar-senha');
                
                if (novaSenha.length < 6) {
                    alert('A senha deve ter pelo menos 6 caracteres.');
                    return;
                }
                
                if (novaSenha !== confSenha) {
                    alert('As senhas não coincidem.');
                    return;
                }

                try {
                    btnSalvar.textContent = "Atualizando...";
                    btnSalvar.disabled = true;

                    const respostaSenha = await fetch(`http://localhost:3000/api/usuarios/${sessao.id}/senha`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ novaSenha: novaSenha })
                    });

                    if (respostaSenha.ok) {
                        alert('Senha atualizada com sucesso no banco de dados!');
                        document.getElementById('nova-senha').value = '';
                        document.getElementById('conf-senha').value = '';
                    } else {
                        alert('Erro ao tentar atualizar a senha.');
                    }
                } catch (erro) {
                    alert('Erro de conexão com o servidor.');
                } finally {
                    btnSalvar.textContent = "Atualizar senha";
                    btnSalvar.disabled = false;
                }
            });
        };
    </script>
</body>
</html>
